name = "mianu-public"
main = "src/index.ts"
compatibility_date = "2024-06-14"
compatibility_flags = ["nodejs_compat"]

# The integration README is served by the worker itself (GET /docs/WATER_API.md),
# so it is inlined at build time from the repo's single copy of the doc.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = false

[[d1_databases]]
binding = "DB"
database_name = "mianu-app-db"
database_id = "c0ddbf82-7b83-4fef-a8cb-86538d57fa72"
